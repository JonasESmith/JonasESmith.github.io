# Approximates GitHub Pages: gzip, max-age=600, /404.html, trailing-slash redirects.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects (/project/X -> /project/X/), so the host port mapping is kept.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 256;

    add_header Cache-Control "max-age=600";

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
