[package]
name = "portfolio-gen"
version = "0.1.0"
edition = "2021"
description = "Static site generator: Obsidian vault -> prerendered portfolio HTML"

[[bin]]
name = "gen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
brotli = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["avif", "gif", "jpeg", "png", "rayon", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2.5"

[profile.release]
opt-level = 3
