name: ci

# Build the site from vault/ and enforce the size budgets (gen report --check).
# Deployment is separate (P6).
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm (rav1e AVIF encoder asm)
        run: sudo apt-get update && sudo apt-get install -y nasm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gen

      # Encoded images are content-addressed; restoring the cache skips re-encoding unchanged ones.
      - uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('gen/src/assets.rs') }}-${{ hashFiles('vault/**') }}
          restore-keys: img-${{ hashFiles('gen/src/assets.rs') }}-

      - name: Build
        run: cargo run --release --manifest-path gen/Cargo.toml -- build

      - name: Size budget
        run: cargo run --release --manifest-path gen/Cargo.toml -- report --check >> "$GITHUB_STEP_SUMMARY"
