name: build & deploy

# Every push / PR: build vault/ -> dist/ and enforce size budgets.
# Pushes to master (and manual runs) also publish to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions".
#
# Speed (same idea as horro_campaign's cached dx binary):
# - the compiled `gen` binary is cached, keyed on the generator's sources. Content-only pushes
#   (vault edits) restore it and skip the Rust toolchain, nasm and the ~100s compile.
# - encoded images are cached in .cache/img (content-addressed), so only new or changed images encode.
# - a newer push to the same ref cancels the older run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore generator binary
        id: gen-bin
        uses: actions/cache@v4
        with:
          path: bin/gen
          key: gen-${{ runner.os }}-${{ hashFiles('gen/src/**', 'gen/static/**', 'gen/themes.toml', 'gen/Cargo.toml', 'gen/Cargo.lock') }}

      # ---- only when the generator changed ----
      - name: Install nasm (rav1e AVIF encoder asm)
        if: steps.gen-bin.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust
        if: steps.gen-bin.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust dependency cache
        if: steps.gen-bin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gen
          cache-on-failure: true

      - name: Compile generator
        if: steps.gen-bin.outputs.cache-hit != 'true'
        run: |
          cargo build --release --manifest-path gen/Cargo.toml
          mkdir -p bin && cp gen/target/release/gen bin/gen
      # -----------------------------------------

      - name: Image cache
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('gen/src/assets.rs') }}-${{ hashFiles('vault/**') }}
          restore-keys: img-${{ hashFiles('gen/src/assets.rs') }}-

      - name: Build site
        run: bin/gen build

      - name: Size budget
        run: bin/gen report --check >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
