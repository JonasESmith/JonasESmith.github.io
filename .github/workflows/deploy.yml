name: deploy

# Build vault/ -> dist/, enforce size budgets, publish to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm (rav1e AVIF encoder asm)
        run: sudo apt-get update && sudo apt-get install -y nasm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gen

      - uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('gen/src/assets.rs') }}-${{ hashFiles('vault/**') }}
          restore-keys: img-${{ hashFiles('gen/src/assets.rs') }}-

      - name: Build
        run: cargo run --release --manifest-path gen/Cargo.toml -- build

      - name: Size budget
        run: cargo run --release --manifest-path gen/Cargo.toml -- report --check >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
